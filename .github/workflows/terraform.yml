name: Terraform CI

on:
  pull_request:
    branches: [main]
    paths:
      - '**.tf'
      - '**.tfvars.example'
      - '.github/workflows/terraform.yml'
  push:
    branches: [dev]
    paths:
      - '**.tf'
      - '**.tfvars.example'
      - '.github/workflows/terraform.yml'

jobs:
  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [aws, gcp]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Format Check
        working-directory: environments/${{ matrix.environment }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: environments/${{ matrix.environment }}
        run: terraform validate

  terraform-lint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive --format compact

  terraform-security:
    name: Terraform Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true
          format: default

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [terraform-validation, terraform-lint, terraform-security]
    if: always()
    
    steps:
      - name: Check results
        run: |
          echo "## Terraform CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Validation: ${{ needs.terraform-validation.result }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Lint: ${{ needs.terraform-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Security: ${{ needs.terraform-security.result }}" >> $GITHUB_STEP_SUMMARY